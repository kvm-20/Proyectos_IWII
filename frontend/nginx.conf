server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API: se envian al contenedor/servicio "backend"
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
    }

    # React Router: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
