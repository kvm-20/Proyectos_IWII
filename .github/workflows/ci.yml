name: CI BiblioWeb

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend - pruebas con pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: pytest

  frontend:
    name: Frontend - build de React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker - construir imagenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de ejemplo para el pipeline
        run: cp .env.example .env
      - name: Validar docker-compose
        run: docker compose config --quiet
      - name: Construir imagenes
        run: docker compose build backend frontend
