# Base de datos MySQL con almacenamiento persistente
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: biblioweb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: biblioweb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - containerPort: 3306
          # Las credenciales vienen del Secret "biblioweb-secret" (creado desde el archivo .env)
          envFrom:
            - secretRef:
                name: biblioweb-secret
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: biblioweb
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
      targetPort: 3306
