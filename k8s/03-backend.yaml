apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: biblioweb
spec:
  # Dos replicas: Kubernetes reparte las peticiones entre ambas y, si una
  # falla, la reemplaza automaticamente.
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: biblioweb-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: biblioweb-config
            - secretRef:
                name: biblioweb-secret
          # Readiness: el pod no recibe trafico hasta responder /health.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          # Liveness: si deja de responder, Kubernetes lo reinicia.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: biblioweb
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
